version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: roofing_db
    restart: always
    environment:
      MYSQL_DATABASE: creafzdi_roofing
      MYSQL_USER: creafzdi_roofing_admin
      MYSQL_PASSWORD: "Admin9632$$$$"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      # Se monta el dump para que se importe automáticamente al iniciar la BD vacía.
      - ./creafzdi_roofing.sql:/docker-entrypoint-initdb.d/init.sql:ro

  wordpress:
    image: wordpress:latest
    container_name: roofing_wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: creafzdi_roofing
      WORDPRESS_DB_USER: creafzdi_roofing_admin
      WORDPRESS_DB_PASSWORD: "Admin9632$$$$"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
